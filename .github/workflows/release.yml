# Publishes a GitHub release when a version tag (v1.2.3) is pushed. Aurral
# installs and updates plugins from a repo's latest release, using its first
# .zip asset.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          node --check index.js

      - name: Build the plugin zip
        run: zip run-scripts.zip manifest.json index.js README.md LICENSE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" run-scripts.zip \
            --title "Run scripts $GITHUB_REF_NAME" \
            --generate-notes
